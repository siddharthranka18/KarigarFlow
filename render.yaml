services:
  - type: web
    name: karigarflow-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: karigarflow-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
databases:
  - name: karigarflow-demo-db
    plan: free
    databaseName: karigarflow
    user: karigarflow
    ipAllowList: []
